[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorheal-backend"
version = "0.1.0"
description = "Local-first MirrorHeal AI hackathon backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120,<1.0",
    "google-genai>=1.0,<2.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "sqlmodel>=0.0.24,<0.1",
    "scikit-learn>=1.6,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
