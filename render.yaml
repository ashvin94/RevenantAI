services:
  - type: web
    name: mirrorheal-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGIN
        fromService:
          type: web
          name: mirrorheal-ui
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        value: sqlite:///./mirrorheal.db
      - key: ENABLE_FAULT_INJECTION
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_ARTIFACT_PATH
        value: artifacts/isolation_forest.joblib
      - key: ML_METADATA_PATH
        value: artifacts/isolation_forest.metadata.json

  - type: web
    name: mirrorheal-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: mirrorheal-api
          envVarKey: RENDER_EXTERNAL_URL
